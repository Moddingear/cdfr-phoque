; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = ststm32
board = PHOQUE2A
board_build.variants_dir = custom_arduino_variant
framework = arduino
lib_deps = 
    https://github.com/Moddingear/SimpleCanLib.git
    ;https://github.com/Dlloydev/sTune.git
lib_archive = no
monitor_speed = 115200
upload_protocol = custom
extra_scripts = dfu_upload.py
;build_type = debug
build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D BAUD_RATE=${this.monitor_speed}
    -D HAL_CORDIC_MODULE_ENABLED
    -D HAL_COMP_MODULE_ENABLED
    -D HAL_DAC_MODULE_ONLY
    ;-D SIMPLEFOC_DISABLE_DEBUG
    -D HAL_TIM_MODULE_ONLY
    ;-D PHOQUE_DEBUG_SAMPLING
    ;-D ASYNC_SENSOR
    ;-D TIM1_DEBUG
    -D SIMPLECANLIB=0
    -D HAL_CAN=0
    -D STANDALONE=1
    -D COMMANDER=1
    -D DEMO=0
    -D BRAKE_EN=1
    ;-H
    -flto
debug_build_flags = -Os -s -ggdb3

[env:PHOQUE1]
board = PHOQUE1

[env:PHOQUE2]
board = PHOQUE2A

[env:debug]
build_type = debug